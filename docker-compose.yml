version: "3.9"

services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    working_dir: /app
    command: python main.py

    # Map persistent data to keep config/xp safe across rebuilds
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      # - .:/app  # Optional: map whole repo for development live-reload
